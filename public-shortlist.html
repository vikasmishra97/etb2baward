<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalists | ETB2B Awards</title><style>body{margin:0;background:#f6f8fc;font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#1c304a}header{background:#111f34;color:white;padding:42px max(24px,calc((100vw - 1000px)/2))}header small{color:#9bc2ef;text-transform:uppercase;font-weight:800;letter-spacing:2px}h1{margin:10px 0;font-size:clamp(30px,4vw,44px)}main{max-width:1000px;margin:30px auto;padding:0 20px}.intro{margin-bottom:20px;color:#5c6c7d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{border:1px solid #e1e8f1;background:white;padding:23px;border-radius:15px;box-shadow:0 8px 25px #132e4c08}.card small{color:#1d6499;font-weight:750;letter-spacing:.06em;text-transform:uppercase}.card h2{font-size:20px;margin:10px 0 5px}.card p{color:#617085;margin:0}.status{padding:16px 20px;border-radius:12px;border:1px solid #dce7f2;background:white}footer{margin:45px auto 20px;max-width:1000px;padding:0 20px;color:#77859a;font-size:12px}</style></head><body><header><small>ETB2B Awards</small><h1>Meet the shortlisted finalists</h1><p>Recognising outstanding nominations selected by the jury.</p></header><main><p class="intro" id="heading">Published shortlist</p><div id="list" class="grid" aria-live="polite"><div class="status">Loading finalists…</div></div></main><footer>ETB2B Awards · Official shortlist</footer><script>async function load(){const el=document.getElementById('list');try{const r=await fetch('./published-shortlist.json',{cache:'no-store'});if(!r.ok)throw Error('Not yet published');const data=await r.json();if(data.type!=='shortlist'||!Array.isArray(data.items))throw Error('Invalid published data');document.getElementById('heading').textContent=[data.category,'Jury Level '+data.level].filter(Boolean).join(' · ');el.replaceChildren();if(!data.items.length){el.innerHTML='<div class="status">The shortlist has not been announced yet.</div>';return}data.items.forEach(x=>{const card=document.createElement('article');card.className='card';const cat=document.createElement('small');cat.textContent=x.category||'Finalist';const title=document.createElement('h2');title.textContent=x.name||x.company||'Finalist';const company=document.createElement('p');company.textContent=x.company||'';card.append(cat,title,company);el.append(card)})}catch(e){el.innerHTML='<div class="status">The shortlist has not been published on this website yet.</div>'}}load();</script></body></html>

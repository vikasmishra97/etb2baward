<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Reviews · ETB2B Awards Jury</title><link rel="icon" type="image/jpeg" href="et-logo.jpg">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#f5f6f8;color:#121625}.portal{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#17181b;color:#fff;padding:26px 20px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center}.brand img{width:42px;height:42px;background:#fff;border-radius:9px}.brand b{font-size:17px}.award{margin:28px 0 12px;font-size:12px;color:#b8bec8}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;background:transparent;color:#bfc4cd;padding:12px;border-radius:8px;font-weight:700;cursor:pointer}.nav button.active{background:#2b2d31;color:#fff}.logout{margin-top:auto;border:1px solid #4a4c52;background:transparent;color:#fff;padding:11px;border-radius:8px;cursor:pointer}.main{padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.top small{color:#777ca0;font-weight:800;letter-spacing:.08em}.top h1{margin:5px 0;font-size:28px}.level-pill{background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:12px 15px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:16px}.stat span{font-size:12px;color:#737b8c}.stat b{display:block;font-size:25px;margin-top:6px}.panel{background:#fff;border:1px solid #e2e5ea;border-radius:14px;overflow:hidden}.panel-head{padding:18px;border-bottom:1px solid #e8ebf0;display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:18px;margin:0}.entry{padding:17px 18px;border-bottom:1px solid #eceff3;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.entry:last-child{border-bottom:0}.entry small{font-size:11px;color:#727b8c;font-weight:800}.entry h3{margin:5px 0;font-size:16px}.entry p{margin:0;color:#7a8292;font-size:12px}.entry button,.primary{border:0;background:#d71920;color:#fff;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.done{color:#138a55;font-weight:800}.modal{position:fixed;inset:0;background:rgba(13,16,24,.55);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:15px;width:min(720px,100%);max-height:90vh;overflow:auto}.modal-head{padding:20px;border-bottom:1px solid #e8ebf0;display:flex;justify-content:space-between;gap:15px}.modal-head button{border:0;background:none;font-size:25px;cursor:pointer}.modal-body{padding:20px}.criterion{display:grid;grid-template-columns:1fr 105px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}.criterion b{display:block}.criterion small{color:#7a8292}.criterion input{height:42px;border:1px solid #d7dce5;border-radius:8px;padding:0 10px;width:100%}.comments textarea{width:100%;min-height:100px;border:1px solid #d7dce5;border-radius:8px;padding:10px}.modal-foot{padding:16px 20px;border-top:1px solid #e8ebf0;display:flex;justify-content:flex-end;gap:9px}.secondary{border:1px solid #d7dce5;background:#fff;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.empty{padding:30px;text-align:center;color:#7a8292}@media(max-width:800px){.portal{grid-template-columns:1fr}.side{display:none}.main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.entry{grid-template-columns:1fr}.top{flex-direction:column}}
  </style>
</head>
<body>
<div class="portal">
  <aside class="side"><div class="brand"><img src="et-logo.jpg"><b>ETB2B Awards</b></div><div class="award">INDIA FINTECH AWARDS 2027</div><div class="nav"><button class="active">My Reviews</button><button id="scoringGuide">Scoring Guide</button><button id="conflictsHelp">Conflicts</button></div><button class="logout" id="juryLogout">Log out</button></aside>
  <main class="main"><div class="top"><div><small>WELCOME BACK</small><h1 id="juryWelcome">Jury Member</h1><p id="juryMeta"></p></div><div class="level-pill" id="juryLevelPill">Jury Level 1</div></div>
    <section class="stats"><div class="stat"><span>Assigned</span><b id="assignedStat">0</b></div><div class="stat"><span>Pending</span><b id="pendingStat">0</b></div><div class="stat"><span>Submitted</span><b id="submittedStat">0</b></div><div class="stat"><span>Categories</span><b id="categoriesStat">0</b></div></section>
    <section class="panel"><div class="panel-head"><h2>My assigned nominations</h2><span id="roundPurpose"></span></div><div id="juryEntries"></div></section>
  </main>
</div>
<div class="modal" id="scoreModal"><div class="modal-card"><div class="modal-head"><div><small id="scoreCategory"></small><h2 id="scoreTitle">Evaluate nomination</h2></div><button id="closeScore">×</button></div><div class="modal-body"><div id="criteriaList"></div><div class="comments"><label><b>Jury comments</b></label><textarea id="juryComments" placeholder="Add assessment notes..."></textarea></div></div><div class="modal-foot"><button class="secondary" id="saveDraftScore">Save draft</button><button class="primary" id="submitScore">Submit evaluation</button></div></div></div>
<script src="jury-portal.js"></script>
</body></html>

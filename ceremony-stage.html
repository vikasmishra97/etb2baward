<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="et-logo.jpg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ceremony Stage · ETB2B Awards</title>
  <link rel="stylesheet" href="ceremony-stage.css">
</head>
<body>
  <main class="stage-shell" id="stageShell">
    <header class="stage-top">
      <div class="stage-brand"><div class="stage-mark"><img src="et-logo.jpg" alt="ET Business Verticals logo"></div><div><b id="stageAwardName">India FinTech Awards 2027</b><small>Official Ceremony</small></div></div>
      <div class="stage-state"><span class="state-dot"></span><b id="stageMode">REHEARSAL</b></div>
    </header>

    <section class="stage-content" id="stageContent">
      <div class="stage-kicker" id="stageKicker">UP NEXT</div>
      <h1 id="stageTitle">Welcome to the India FinTech Awards</h1>
      <p id="stageSubtitle">Stage screen is in rehearsal mode</p>
      <div class="stage-award-level" id="stageAwardLevel" hidden>WINNER</div>
    </section>

    <footer class="stage-bottom">
      <div><span>ETB2B Awards</span><b>Vikas Mishra</b></div>
      <div class="stage-connection"><span></span><b>Synced with Ceremony Control</b></div>
      <a href="ceremony.html">Back to controls</a>
    </footer>
  </main>
  <div class="stage-toast" id="stageToast">Stage cue updated</div>
  <script src="ceremony-stage.js"></script>
</body>
</html>
